; Quanta Test - hardware test program for the "Quanta 4 Channel Driver" board
; Open this folder in VS Code (PlatformIO), press Upload, then open the Serial Monitor.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@^6.9.0          ; Arduino-ESP32 2.0.x, same as the Quanta firmware
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes                      ; show what you type
monitor_eol = LF
upload_speed = 460800
board_build.flash_mode = dio
build_flags = -Wall
